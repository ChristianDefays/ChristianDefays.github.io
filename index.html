<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christian Defays</title>
  <meta name="description" content="BSc student in Econometrics and Operations Research at Maastricht University.">
  <style>
    :root { --bg: #ffffff; --text: #1f2933; --muted: #6b7280; --accent: #0b5cad; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --text: #e5e7eb; --muted: #9ca3af; --accent: #6cb0ff; --line: #2a2f36; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; line-height: 1.65; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 24px 40px; text-align: center; }
    .photo { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; }
    h1 { font-size: 2.4rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 28px; }
    p { margin: 0 0 24px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 10px 20px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .btn:hover { background: var(--accent); color: var(--bg); }
    footer { max-width: 640px; margin: 40px auto 0; padding: 20px 24px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="profile.jpg" alt="Portrait of Christian Defays">
    <h1>Christian Defays</h1>
    <p class="subtitle">Econometrics and Operations Research · Maastricht University</p>
    <p>I am a second-year BSc student in Econometrics and Operations Research at the School of Business and Economics, Maastricht University.</p>
    <div class="links">
      <a class="btn" href="mailto:c.defays@student.maastrichtuniversity.nl">Email</a>
      <a class="btn" href="https://www.linkedin.com/in/christiandefays">LinkedIn</a>
    </div>
  </main>
  <footer>Christian Defays · Maastricht University</footer>
</body>
</html>
